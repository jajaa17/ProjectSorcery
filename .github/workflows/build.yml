name: Build game

# Builds Windows, Linux and macOS players in real Unity (via GameCI).
# - Run it by hand: Actions > Build game > Run workflow  -> download the zips from the run's "Artifacts".
# - Push a version tag (git tag v1.0.0 && git push origin v1.0.0) -> also publishes a GitHub Release with the zips.
# Requires repository secrets UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD (see README > Building a release).

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            name: Windows
          - targetPlatform: StandaloneLinux64
            name: Linux
          - targetPlatform: StandaloneOSX
            name: macOS
    steps:
      - name: Check Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Add the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository secrets first (README > Building a release)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ProjectSorcery
          buildMethod: ProjectSorcery.EditorTools.BuildScript.Build

      - name: Zip build
        run: |
          cd build/${{ matrix.targetPlatform }}
          sudo zip -qr "$GITHUB_WORKSPACE/ProjectSorcery-${{ matrix.name }}.zip" .
          ls -la "$GITHUB_WORKSPACE"/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ProjectSorcery-${{ matrix.name }}
          path: ProjectSorcery-${{ matrix.name }}.zip

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
